# Qwen3-TTS 1.7B Base 口播稿优化参数（仅文字稿层）
# 只保留 scripts/tts/humanize.py 实际读取的两段；参数值来自该模型实测，换模型需重新标定。
# TTS 推理引擎配置（音色/分块/音频/质检等）不属于本 skill，已移除。

humanize:               # L2 拟人化参数（注释性字段 + 脚本实际读取的三个开关）
  style: casual          # casual 朋友聊天（默认）/ soulful 深夜电台 / energetic 激情演讲
  experimental_tags: false  # 允许 LLM 输出 [停顿两秒]/[轻声] 等实验标签（1.7B 不识别，默认关）
  tail_forbidden: true   # 禁止 LLM 新增句尾语气尾缀/语气词（对吧、是吧、吧、啊、呢…），该模型实测听感突兀
  filler_per_item_cap: 1  # 填充词单品限频：同一填充词全篇最多新增几次（只计新增，原文自带的不算）
  tts_normalize: true    # 数字适配：年份逐位读（2008金融危机→二零零八，防读成基数词「两百零八」）、90后→九零后；带单位数字（3000元/15秒）保持原样

breath:                 # 气口密度硬约束（只插标点，不改字）：收口离群长句，防一口气赶读
  enabled: true         # 开关；false 时退回原有「连词优先、阈值18」行为，输出完全不变
  max_span: 16          # 最长无标点区间（字）；实测稿子 p90=13~16，20 时几乎不触发，16 才开始动
  hard_max: 28          # 超过该长度才允许「无连词硬切」（极端区间兜底）
  use_period: false     # true=用句号断（更重）；false=用逗号断。实测两者停顿几乎等长，默认逗号
  para_cap_div: 20      # 每段新增气口上限 = 段字数 / 该值，防止全篇变碎
  strict: false         # false=只在区间后 65% 找断点（最保守）；true=放宽到后 80%，改动略多
                        # 任何模式都只断在语言学信号处，不做无信号盲切（盲切会切坏专名/量词）
